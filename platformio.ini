; 우산꽂이 도난 감지 우산 시제품 - Arduino Uno R3
;
; 주 환경
;   pio run -e logger   : MPU-6050 -> microSD CSV 기록 (실험용, SdFat)
;   pio run -e main     : 최종 기능 (MPU-6050 + HM-10 + 부저, SD 없음)
;
; 부품별 테스트 환경 (하나씩 업로드해서 확인)
;   pio run -e test_mpu     : MPU-6050 값 시리얼 출력
;   pio run -e test_buzzer  : 부저 울리기
;   pio run -e test_ble     : HM-10 <-> 시리얼 모니터 문자 중계
;   pio run -e test_sd      : microSD 파일 쓰기/읽기

[platformio]
default_envs = logger, main

[env]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_flags = -Wall

[env:logger]/


build_src_filter = -<*> +<logger/>
lib_deps =
    electroniccats/MPU6050
    greiman/SdFat

[env:main]
build_src_filter = -<*> +<main/>
lib_deps =
    electroniccats/MPU6050
    paulstoffregen/AltSoftSerial

[env:test_mpu]
build_src_filter = -<*> +<tests/mpu/>
lib_deps =
    electroniccats/MPU6050

[env:test_buzzer]
build_src_filter = -<*> +<tests/buzzer/>

[env:test_ble]
build_src_filter = -<*> +<tests/ble/>
monitor_echo = yes
lib_deps =
    paulstoffregen/AltSoftSerial

; HM-10 모듈 1회 설정 (이름 UMBRELLA + PIN 본딩). PIN 은 실행 시 시리얼로 입력
[env:setup_ble]
build_src_filter = -<*> +<setup/ble/>
monitor_echo = yes
lib_deps =
    paulstoffregen/AltSoftSerial

[env:test_sd]
build_src_filter = -<*> +<tests/sd/>
lib_deps =
    greiman/SdFat
